<script>
/* ======================= polyfills & helpers ======================= */
if(!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.min(r,w/2,h/2);this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();};}
const TAU=Math.PI*2,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
function mix(hex,t,to){const n=parseInt(hex.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;r=Math.round(r+(to-r)*t);g=Math.round(g+(to-g)*t);b=Math.round(b+(to-b)*t);return `rgb(${r},${g},${b})`;}
const lite=(c,t=.35)=>mix(c,t,255),dark=(c,t=.25)=>mix(c,t,0);
const store={get(k,d){try{const v=localStorage.getItem("tp_"+k);return v?JSON.parse(v):d;}catch(e){return d;}},set(k,v){try{localStorage.setItem("tp_"+k,JSON.stringify(v));}catch(e){}}};
const mkc=(w,h)=>{const c=document.createElement("canvas");c.width=w;c.height=h;return c;};
// size a canvas to its parent (retina aware) and return a ready 2D context in CSS pixels
function fit(cv){const r=cv.parentElement.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2),w=Math.max(10,r.width),h=Math.max(10,r.height);
  if(cv.width!==Math.round(w*d)||cv.height!==Math.round(h*d)){cv.width=Math.round(w*d);cv.height=Math.round(h*d);cv.style.width=w+"px";cv.style.height=h+"px";}
  const c=cv.getContext("2d");c.setTransform(d,0,0,d,0,0);return{ctx:c,W:w,H:h};}
function loop(fn){let id,last=performance.now(),run=true;const f=now=>{if(!run)return;const dt=Math.min(.05,(now-last)/1000);last=now;fn(dt,now/1000);id=requestAnimationFrame(f);};id=requestAnimationFrame(f);return()=>{run=false;cancelAnimationFrame(id);};}
function fitFont(ctx,text,maxW,px){ctx.font=`800 ${px}px "Baloo 2",system-ui`;const w=ctx.measureText(text).width;if(w>maxW)px*=maxW/w;ctx.font=`800 ${px}px "Baloo 2",system-ui`;return px;}
function star(ctx,x,y,r,a=1,col="#fff"){ctx.save();ctx.globalAlpha=a;ctx.translate(x,y);ctx.fillStyle=col;ctx.beginPath();for(let i=0;i<8;i++){const rr=i%2?r*.28:r,an=i*Math.PI/4;ctx.lineTo(Math.cos(an)*rr,Math.sin(an)*rr);}ctx.closePath();ctx.fill();ctx.restore();}

/* ======================= data ======================= */
const U_META=[{"w":318,"h":469,"tip":[285,6],"base":[241,84]},{"w":329,"h":465,"tip":[309,4],"base":[271,84]},{"w":277,"h":467,"tip":[233,8],"base":[187,84]},{"w":264,"h":468,"tip":[233,3],"base":[197,85]},{"w":301,"h":477,"tip":[261,4],"base":[223,75]},{"w":328,"h":471,"tip":[247,3],"base":[212,56]},{"w":293,"h":474,"tip":[239,5],"base":[189,79]},{"w":293,"h":462,"tip":[217,7],"base":[171,74]},{"w":309,"h":483,"tip":[250,4],"base":[183,61]},{"w":308,"h":460,"tip":[286,8],"base":[227,64]}];
const U_NAMES=["Sprinkles","Pinkie Pie","Teeny Greeny","Blacky","Bluey Hooey","Tealini","Violet","Twinkle","Aquamarina","Blossom"];
const MANE=["rainbow","#ff3d9a","#4cc23a","#2b2b3a","#2f7be8","#ffd21f","#8a3fd6","rainbow","#2fc7e6","#d79be8"];
const KIT_IDS=[0,1,2,3,4,5,7];
const KIT_NAMES=["Marshmallow","Biscuit","Pickle","Muffin","Noodle","Waffles","Pumpkin"];
const HORNS=[["Gold","gold"],["Pink","#ff6fb5"],["Purple","#a56bff"],["Blue","#4aa8ff"],["Aqua","#34e0d0"],["Green","#5fdc5f"],["Red","#ff5a5a"],["Silver","#d9e4f2"],["Rainbow","rainbow"]];
const ACCS=[["None",""],["Crown","👑"],["Flowers","🌸"],["Bow","🎀"],["Star","⭐"],["Butterfly","🦋"],["Berry","🍓"]];
const COLORS=[["Pink","#ff9ecf"],["Purple","#b98cff"],["Blue","#7fc4ff"],["Teal","#6fe0d0"],["Green","#8be28b"],["Yellow","#ffe66d"],["Orange","#ffb067"],["Red","#ff6b6b"],["White","#ffffff"]];
const PATTERNS=[["Plain","plain"],["Picnic","check"],["Dots","dots"],["Stripes","stripes"],["Stars","stars"],["Hearts","hearts"]];
const DECORS=[["Plain","plain"],["Hearts","hearts"],["Stars","stars"],["Dots","dots"],["Stripes","stripes"]];
const TREATS=[["Cupcake","cupcake"],["Donut","donut"],["Ice cream","icecream"],["Cookie","cookie"],["Cake","cake"]];
const LEVELS=[{n:3,time:80,spd:3.1,tint:0},{n:2,time:75,spd:3.7,tint:1},{n:2,time:75,spd:4.2,tint:2}];
const IMG={u:[],h:[],k:[],woods:null};
const loadImg=src=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src;});
async function loadAll(){const j=[];for(let i=0;i<10;i++){j.push(loadImg(`assets/unicorns/u${i}.png`).then(x=>IMG.u[i]=x));j.push(loadImg(`assets/unicorns/h${i}.png`).then(x=>IMG.h[i]=x));}
  for(let i=0;i<8;i++)j.push(loadImg(`assets/kittens/k${i}.png`).then(x=>IMG.k[i]=x));j.push(loadImg("assets/woods.jpg").then(x=>IMG.woods=x));await Promise.all(j);}

/* ======================= sound + voice ======================= */
const Snd={ctx:null,master:null,mus:null,muted:false,mode:null,timer:null,step:0,next:0,
 init(){if(!this.ctx){try{this.ctx=new(window.AudioContext||window.webkitAudioContext)();this.master=this.ctx.createGain();this.master.gain.value=this.muted?0:.85;this.master.connect(this.ctx.destination);
   this.mus=this.ctx.createGain();this.mus.gain.value=.3;this.mus.connect(this.master);
   const b=this.ctx.createBuffer(1,1,22050),s=this.ctx.createBufferSource();s.buffer=b;s.connect(this.ctx.destination);s.start(0);}catch(e){this.ctx=null;}}
  if(this.ctx&&this.ctx.state!=="running")this.ctx.resume();},
 setMuted(m){this.muted=m;if(this.master)this.master.gain.value=m?0:.85;if(m&&window.speechSynthesis)speechSynthesis.cancel();},
 tone(f,t,d,type="sine",v=.2,dest,f2){if(!this.ctx)return;const c=this.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(dest||this.master);o.start(t);o.stop(t+d+.05);},
 bell(f,t,d=.5,v=.16,dest){this.tone(f,t,d,"triangle",v,dest);this.tone(f*2,t,d*.6,"sine",v*.4,dest);},
 mid(n){return 440*Math.pow(2,(n-69)/12);},
 now(){return this.ctx?this.ctx.currentTime:0;},
 click(){if(this.ctx)this.tone(520,this.now(),.09,"triangle",.2,null,880);},
 pop(){if(this.ctx)this.tone(300,this.now(),.12,"sine",.3,null,700);},
 sparkle(){if(!this.ctx)return;const t=this.now();[84,88,91,96,100].forEach((n,i)=>this.bell(this.mid(n),t+i*.07,.35,.12));},
 hoof(i){if(this.ctx)this.tone(i%2?95:120,this.now(),.08,"sine",.09,null,60);},
 chirp(){if(!this.ctx)return;const t=this.now(),f=2200+Math.random()*1200;this.tone(f,t,.08,"sine",.035,null,f*1.4);this.tone(f*1.2,t+.11,.08,"sine",.035,null,f*1.7);},
 whoosh(){if(this.ctx)this.tone(250,this.now(),.45,"triangle",.12,null,1400);},
 giggle(){if(!this.ctx)return;const t=this.now();[0,.09,.18,.27,.36].forEach((d,i)=>this.tone(700+(i%2)*160+i*30,t+d,.08,"sine",.14,null,900));},
 tick(){if(this.ctx)this.tone(1200,this.now(),.05,"square",.05);},
 meow(pan=0,vol=.25){if(!this.ctx||this.muted)return;const c=this.ctx,t=c.currentTime,o=c.createOscillator(),f=c.createBiquadFilter(),g=c.createGain();
  o.type="sawtooth";o.frequency.setValueAtTime(430,t);o.frequency.linearRampToValueAtTime(820,t+.14);o.frequency.linearRampToValueAtTime(470,t+.5);
  f.type="bandpass";f.Q.value=3.5;f.frequency.setValueAtTime(900,t);f.frequency.linearRampToValueAtTime(1900,t+.18);f.frequency.linearRampToValueAtTime(1000,t+.5);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(vol,.002),t+.07);g.gain.exponentialRampToValueAtTime(.0001,t+.55);o.connect(f);f.connect(g);let out=g;
  if(c.createStereoPanner){const p=c.createStereoPanner();p.pan.value=clamp(pan,-1,1);g.connect(p);out=p;}out.connect(this.master);o.start(t);o.stop(t+.6);},
 fanfare(){if(!this.ctx)return;const t=this.now();[[72,0],[76,.12],[79,.24],[84,.36],[79,.52],[84,.62],[88,.78]].forEach(([n,d])=>this.bell(this.mid(n),t+d,.6,.18));},
 sad(){if(!this.ctx)return;const t=this.now();[[67,0],[64,.25],[60,.5]].forEach(([n,d])=>this.bell(this.mid(n),t+d,.6,.14));},
 truck(){if(!this.ctx)return;const t=this.now();[[72,0],[74,.28],[76,.56],[72,.84],[76,1.12],[72,1.4],[76,1.68],[79,1.96],[77,2.4],[76,2.68],[74,2.96],[76,3.24],[74,3.52],[72,3.8]].forEach(([n,d])=>this.bell(this.mid(n),t+d,.4,.17));},
 music(mode){this.mode=mode;if(!this.ctx||this.timer)return;this.step=0;this.next=this.ctx.currentTime+.15;this.timer=setInterval(()=>this.sched(),150);},
 sched(){if(!this.ctx)return;const spb=this.mode==="woods"?.2:this.mode==="party"?.17:.26;while(this.next<this.ctx.currentTime+.4){this.playStep(this.step++,this.next);this.next+=spb;}},
 playStep(s,t){const P=[0,2,4,7,9,12,14,16];
  const mel={menu:[4,-1,2,-1,4,-1,7,-1,5,-1,4,-1,2,-1,-1,-1],party:[7,4,7,9,7,4,2,4,7,9,12,9,7,4,2,-1],woods:[2,-1,4,2,0,-1,2,4,5,-1,4,2,4,-1,-1,-1]}[this.mode]||[];
  const bass={menu:[0,-1,-1,-1,-3,-1,-1,-1],party:[0,-1,4,-1,-3,-1,0,-1],woods:[0,-1,-1,-1,-5,-1,-1,-1]}[this.mode]||[];
  const m=mel[s%mel.length];if(m>=0)this.bell(this.mid(60+(P[m]??m)+(this.mode==="woods"?-5:0)),t,.45,.1,this.mus);
  const b=bass[s%bass.length];if(b!==undefined&&b!==-1&&s%2===0)this.tone(this.mid(48+b),t,.5,"sine",.15,this.mus);}
};
function say(t){if(Snd.muted||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.95;u.pitch=1.35;
  const v=speechSynthesis.getVoices().find(v=>/^en/i.test(v.lang)&&/(Samantha|Karen|Moira|Tessa|Google US|Female)/i.test(v.name));if(v)u.voice=v;speechSynthesis.speak(u);}catch(e){}}
document.getElementById("mute").onclick=()=>{Snd.init();Snd.setMuted(!Snd.muted);document.getElementById("mute").textContent=Snd.muted?"🔇":"🔊";store.set("muted",Snd.muted);};
Snd.muted=store.get("muted",false);document.getElementById("mute").textContent=Snd.muted?"🔇":"🔊";
addEventListener("pointerdown",()=>Snd.init());

/* ======================= unicorn rendering ======================= */
const cache=new Map();
function hornFill(ctx,horn,w,h){if(horn==="rainbow"){const g=ctx.createLinearGradient(0,0,w,h);["#ff5a5a","#ffd84d","#5fdc5f","#4aa8ff","#a56bff"].forEach((c,i)=>g.addColorStop(i/4,c));ctx.fillStyle=g;}else ctx.fillStyle=horn;ctx.fillRect(0,0,w,h);}
function coloredBase(cfg){const key=cfg.id+"|"+cfg.horn;if(cache.has(key))return cache.get(key);const u=IMG.u[cfg.id],hl=IMG.h[cfg.id];
  const c=mkc(u.width,u.height),x=c.getContext("2d");x.drawImage(u,0,0);
  if(cfg.horn!=="gold"&&hl){const t=mkc(u.width,u.height),tx=t.getContext("2d");tx.drawImage(hl,0,0);tx.globalCompositeOperation="color";hornFill(tx,cfg.horn,t.width,t.height);tx.globalCompositeOperation="destination-in";tx.drawImage(hl,0,0);x.drawImage(t,0,0);}
  cache.set(key,c);return c;}
function drawUni(ctx,cfg,x,y,h,flip,extra={}){const base=coloredBase(cfg),m=U_META[cfg.id],s=h/m.h,w=m.w*s;
  ctx.save();ctx.translate(x,y);if(extra.tilt)ctx.rotate(extra.tilt);if(extra.squash)ctx.scale(1+extra.squash,1-extra.squash);if(flip)ctx.scale(-1,1);
  ctx.drawImage(base,-w/2,-h,w,h);
  if(cfg.acc){ctx.font=`${h*(extra.accSize||.2)}px "Apple Color Emoji","Segoe UI Emoji",sans-serif`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(cfg.acc,(m.base[0]-60)*s-w/2,(m.base[1]-26)*s-h);}
  ctx.restore();}
function hornTip(cfg,x,y,h,flip){const m=U_META[cfg.id],s=h/m.h;let dx=(m.tip[0]-m.w/2)*s;if(flip)dx=-dx;return{x:x+dx,y:y-h+m.tip[1]*s};}
function uniThumb(id,hh){const m=U_META[id],c=mkc(Math.ceil(m.w*hh/m.h)+4,hh+2);drawUni(c.getContext("2d"),{id,horn:"gold",acc:""},c.width/2,c.height-1,hh,false);return c;}

/* ======================= party item art (all recolorable) ======================= */
function decorFill(ctx,kind,cx,cy,rx,ry,color){ // draw a pattern inside current clip
  const L=lite(color,.6),D=dark(color,.22);ctx.save();
  if(kind==="hearts"||kind==="stars"){ctx.fillStyle=L;ctx.font=`${rx*.34}px sans-serif`;ctx.textAlign="center";ctx.textBaseline="middle";
    for(let j=-2;j<=2;j++)for(let i=-3;i<=3;i++){const x=cx+i*rx*.34+(j%2?rx*.17:0),y=cy+j*ry*.4;ctx.fillText(kind==="hearts"?"♥":"★",x,y);}}
  else if(kind==="dots"){ctx.fillStyle=L;for(let j=-2;j<=2;j++)for(let i=-3;i<=3;i++){ctx.beginPath();ctx.arc(cx+i*rx*.3+(j%2?rx*.15:0),cy+j*ry*.38,rx*.065,0,TAU);ctx.fill();}}
  else if(kind==="stripes"){ctx.fillStyle=L;for(let i=-4;i<=4;i++)ctx.fillRect(cx+i*rx*.24-rx*.05,cy-ry*1.2,rx*.1,ry*2.4);}
  ctx.restore();}
function drawBlanket(ctx,cx,cy,rx,ry,color,pat){
  ctx.save();ctx.fillStyle=dark(color,.28);ctx.beginPath();ctx.ellipse(cx,cy+ry*.1,rx,ry,0,0,TAU);ctx.fill();
  ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,0,TAU);ctx.fillStyle=color;ctx.fill();ctx.save();ctx.clip();
  const s=rx/6.5,L=lite(color,.62);
  if(pat==="check"){ctx.fillStyle="rgba(255,255,255,.42)";for(let x=-rx;x<rx;x+=s*2)ctx.fillRect(cx+x,cy-ry,s,ry*2);for(let y=-ry;y<ry;y+=s*.9*2)ctx.fillRect(cx-rx,cy+y,rx*2,s*.9);}
  else if(pat==="dots"){ctx.fillStyle="rgba(255,255,255,.7)";for(let j=-4;j<=4;j++)for(let i=-8;i<=8;i++){ctx.beginPath();ctx.arc(cx+i*s*1.2+(j%2?s*.6:0),cy+j*ry*.28,s*.28,0,TAU);ctx.fill();}}
  else if(pat==="stripes"){ctx.fillStyle="rgba(255,255,255,.45)";for(let x=-rx*1.2;x<rx*1.2;x+=s*1.8)ctx.fillRect(cx+x,cy-ry,s*.8,ry*2);}
  else if(pat==="stars"||pat==="hearts"){ctx.fillStyle=L;ctx.font=`${s*1.15}px sans-serif`;ctx.textAlign="center";ctx.textBaseline="middle";for(let j=-3;j<=3;j++)for(let i=-6;i<=6;i++)ctx.fillText(pat==="stars"?"★":"♥",cx+i*s*1.5+(j%2?s*.75:0),cy+j*ry*.3);}
  ctx.restore();
  ctx.strokeStyle="rgba(255,255,255,.9)";ctx.lineWidth=Math.max(3,rx*.012);ctx.setLineDash([rx*.04,rx*.03]);ctx.beginPath();ctx.ellipse(cx,cy,rx*.96,ry*.92,0,0,TAU);ctx.stroke();ctx.restore();}
function drawTeapot(ctx,x,y,s,color,decor){ctx.save();ctx.translate(x,y);const w=s,h=s*.8,D=dark(color,.2),L=lite(color,.45);
  ctx.fillStyle="rgba(60,40,90,.2)";ctx.beginPath();ctx.ellipse(0,0,w*.52,w*.09,0,0,TAU);ctx.fill();
  ctx.lineCap="round";ctx.strokeStyle=D;ctx.lineWidth=w*.1;ctx.beginPath();ctx.moveTo(w*.36,-h*.62);ctx.bezierCurveTo(w*.82,-h*.78,w*.8,-h*.18,w*.38,-h*.2);ctx.stroke();
  ctx.lineWidth=w*.12;ctx.beginPath();ctx.moveTo(-w*.36,-h*.28);ctx.bezierCurveTo(-w*.66,-h*.3,-w*.7,-h*.72,-w*.64,-h*.86);ctx.stroke();
  const g=ctx.createRadialGradient(-w*.15,-h*.6,w*.05,0,-h*.4,w*.55);g.addColorStop(0,L);g.addColorStop(.55,color);g.addColorStop(1,D);
  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,-h*.4,w*.46,h*.4,0,0,TAU);ctx.fill();
  ctx.save();ctx.beginPath();ctx.ellipse(0,-h*.4,w*.46,h*.4,0,0,TAU);ctx.clip();decorFill(ctx,decor,0,-h*.4,w*.46,h*.4,color);ctx.restore();
  ctx.fillStyle=color;ctx.strokeStyle=D;ctx.lineWidth=w*.02;ctx.beginPath();ctx.ellipse(0,-h*.76,w*.26,h*.13,0,Math.PI,0);ctx.fill();ctx.stroke();
  ctx.fillStyle=L;ctx.beginPath();ctx.arc(0,-h*.92,w*.06,0,TAU);ctx.fill();ctx.stroke();
  ctx.fillStyle="rgba(255,255,255,.55)";ctx.beginPath();ctx.ellipse(-w*.22,-h*.55,w*.07,h*.13,.5,0,TAU);ctx.fill();ctx.restore();}
function drawCup(ctx,x,y,s,color,decor,T=0){ctx.save();ctx.translate(x,y);const w=s,D=dark(color,.2),L=lite(color,.45);
  ctx.fillStyle="rgba(60,40,90,.2)";ctx.beginPath();ctx.ellipse(0,w*.02,w*.6,w*.1,0,0,TAU);ctx.fill();
  ctx.fillStyle="#fff";ctx.strokeStyle="#e8dcff";ctx.lineWidth=w*.025;ctx.beginPath();ctx.ellipse(0,-w*.03,w*.56,w*.1,0,0,TAU);ctx.fill();ctx.stroke();
  ctx.strokeStyle=D;ctx.lineWidth=w*.09;ctx.lineCap="round";ctx.beginPath();ctx.arc(w*.4,-w*.38,w*.17,-1.5,1.5);ctx.stroke();
  const bp=()=>{ctx.beginPath();ctx.moveTo(-w*.46,-w*.62);ctx.lineTo(w*.46,-w*.62);ctx.quadraticCurveTo(w*.42,-w*.04,0,-w*.04);ctx.quadraticCurveTo(-w*.42,-w*.04,-w*.46,-w*.62);ctx.closePath();};
  const g=ctx.createLinearGradient(-w*.46,0,w*.46,0);g.addColorStop(0,L);g.addColorStop(.45,color);g.addColorStop(1,D);ctx.fillStyle=g;bp();ctx.fill();
  ctx.save();bp();ctx.clip();decorFill(ctx,decor,0,-w*.33,w*.46,w*.3,color);ctx.restore();
  ctx.fillStyle=lite(color,.7);ctx.beginPath();ctx.ellipse(0,-w*.62,w*.46,w*.09,0,0,TAU);ctx.fill();
  ctx.fillStyle="#d98aa6";ctx.beginPath();ctx.ellipse(0,-w*.62,w*.4,w*.07,0,0,TAU);ctx.fill();
  for(let i=0;i<3;i++){const ph=(T*.5+i/3)%1;ctx.fillStyle=`rgba(255,255,255,${.45*(1-ph)})`;ctx.beginPath();ctx.arc(Math.sin(T*2+i*2)*w*.08,-w*.7-ph*w*.5,w*(.05+ph*.08),0,TAU);ctx.fill();}
  ctx.restore();}
function sprinkles(ctx,n,rx,ry,cy){const cs=["#fff","#ffe66d","#6fd0ff","#ff6fb5","#8be28b"];for(let i=0;i<n;i++){const a=i*2.4,r=Math.sqrt((i+1)/n);ctx.save();ctx.translate(Math.cos(a)*rx*r,cy+Math.sin(a)*ry*r);ctx.rotate(i);ctx.fillStyle=cs[i%5];ctx.fillRect(-rx*.07,-rx*.02,rx*.14,rx*.04);ctx.restore();}}
function drawTreat(ctx,x,y,s,type,color){ctx.save();ctx.translate(x,y);const D=dark(color,.2),L=lite(color,.5);
  ctx.fillStyle="rgba(60,40,90,.18)";ctx.beginPath();ctx.ellipse(0,0,s*.5,s*.09,0,0,TAU);ctx.fill();
  if(type==="cupcake"){ctx.fillStyle="#ffe0b0";ctx.beginPath();ctx.moveTo(-s*.34,-s*.42);ctx.lineTo(s*.34,-s*.42);ctx.lineTo(s*.24,0);ctx.lineTo(-s*.24,0);ctx.closePath();ctx.fill();
    ctx.strokeStyle="#f3bf7a";ctx.lineWidth=s*.03;for(let i=-3;i<=3;i++){ctx.beginPath();ctx.moveTo(i*s*.1,-s*.42);ctx.lineTo(i*s*.07,0);ctx.stroke();}
    [[0,-s*.5,.42,.2],[0,-s*.67,.34,.17],[0,-s*.82,.22,.14]].forEach(([a,b,rw,rh],i)=>{ctx.fillStyle=i%2?L:color;ctx.beginPath();ctx.ellipse(a,b,s*rw,s*rh,0,0,TAU);ctx.fill();ctx.strokeStyle=D;ctx.lineWidth=s*.015;ctx.stroke();});
    ctx.fillStyle="#ff4d5e";ctx.beginPath();ctx.arc(0,-s*.98,s*.08,0,TAU);ctx.fill();ctx.save();ctx.translate(0,0);sprinkles(ctx,9,s*.28,s*.12,-s*.66);ctx.restore();}
  else if(type==="donut"){ctx.fillStyle="#e3a867";ctx.beginPath();ctx.ellipse(0,-s*.2,s*.5,s*.3,0,0,TAU);ctx.fill();ctx.fillStyle="#c98a4c";ctx.beginPath();ctx.ellipse(0,-s*.14,s*.5,s*.26,0,0,Math.PI);ctx.fill();
    ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(0,-s*.25,s*.46,s*.26,0,0,TAU);ctx.moveTo(s*.16,-s*.22);ctx.ellipse(0,-s*.22,s*.16,s*.085,0,0,TAU,true);ctx.fill("evenodd");
    ctx.fillStyle="rgba(255,255,255,.4)";ctx.beginPath();ctx.ellipse(-s*.22,-s*.36,s*.12,s*.04,-.3,0,TAU);ctx.fill();sprinkles(ctx,14,s*.38,s*.18,-s*.27);}
  else if(type==="icecream"){ctx.fillStyle="#e8b66a";ctx.beginPath();ctx.moveTo(-s*.22,-s*.5);ctx.lineTo(s*.22,-s*.5);ctx.lineTo(0,0);ctx.closePath();ctx.fill();
    ctx.strokeStyle="#c98f45";ctx.lineWidth=s*.02;for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(i*s*.09-s*.2,-s*.47);ctx.lineTo(i*s*.09+s*.12,-s*.1);ctx.stroke();ctx.beginPath();ctx.moveTo(i*s*.09+s*.2,-s*.47);ctx.lineTo(i*s*.09-s*.12,-s*.1);ctx.stroke();}
    ctx.fillStyle=color;ctx.beginPath();ctx.arc(0,-s*.62,s*.27,0,TAU);ctx.fill();ctx.fillStyle=L;ctx.beginPath();ctx.arc(0,-s*.9,s*.22,0,TAU);ctx.fill();
    ctx.fillStyle=color;ctx.beginPath();ctx.arc(-s*.2,-s*.5,s*.07,0,TAU);ctx.arc(s*.14,-s*.48,s*.06,0,TAU);ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.5)";ctx.beginPath();ctx.ellipse(-s*.1,-s*.98,s*.06,s*.04,-.5,0,TAU);ctx.fill();ctx.fillStyle="#ff4d5e";ctx.beginPath();ctx.arc(0,-s*1.12,s*.07,0,TAU);ctx.fill();}
  else if(type==="cookie"){ctx.fillStyle="#d49a5a";ctx.beginPath();ctx.arc(0,-s*.42,s*.42,0,TAU);ctx.fill();ctx.fillStyle="#b97a3f";ctx.beginPath();ctx.arc(0,-s*.38,s*.42,0,Math.PI);ctx.fill();
    ctx.fillStyle="#6b3f24";[[-.2,-.55],[.12,-.62],[.22,-.38],[-.1,-.32],[.0,-.48],[-.28,-.36]].forEach(([a,b])=>{ctx.beginPath();ctx.ellipse(a*s,b*s,s*.06,s*.045,a,0,TAU);ctx.fill();});
    ctx.strokeStyle=color;ctx.lineWidth=s*.07;ctx.lineCap="round";ctx.lineJoin="round";ctx.beginPath();for(let i=0;i<7;i++)ctx.lineTo(-s*.3+i*s*.1,-s*.5+(i%2?s*.1:-s*.02));ctx.stroke();}
  else if(type==="cake"){ctx.fillStyle="#f6d9a0";ctx.beginPath();ctx.roundRect(-s*.4,-s*.42,s*.8,s*.42,s*.04);ctx.fill();ctx.fillStyle="#fff";ctx.fillRect(-s*.4,-s*.24,s*.8,s*.07);
    ctx.fillStyle="#e8c27c";ctx.fillRect(-s*.4,-s*.1,s*.8,s*.02);ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(-s*.42,-s*.55,s*.84,s*.15,s*.05);ctx.fill();
    ctx.beginPath();ctx.arc(-s*.28,-s*.4,s*.05,0,TAU);ctx.arc(s*.0,-s*.4,s*.06,0,TAU);ctx.arc(s*.3,-s*.4,s*.05,0,TAU);ctx.fill();
    ctx.fillStyle="#ff3d5e";ctx.beginPath();ctx.arc(0,-s*.64,s*.12,0,TAU);ctx.fill();ctx.fillStyle="#52b04a";ctx.beginPath();ctx.ellipse(0,-s*.76,s*.07,s*.035,0,0,TAU);ctx.fill();
    ctx.fillStyle="#ffd0d6";[[-.04,-.66],[.04,-.62],[0,-.7]].forEach(([a,b])=>{ctx.beginPath();ctx.arc(a*s,b*s,s*.012,0,TAU);ctx.fill();});}
  ctx.restore();}
function thumbOf(fn,w=96,h=84){const c=mkc(w*2,h*2),x=c.getContext("2d");x.scale(2,2);fn(x,w,h);return c;}

/* ======================= app state & screens plumbing ======================= */
const root=document.getElementById("root");
const S={mode:"ai",cfgs:[],party:[],guests:[],found:[],level:0};
const mkCfg=id=>({id,horn:"gold",acc:"",name:U_NAMES[id]});
const mkParty=()=>({blanket:"#ff9ecf",pattern:"check",pot:"#7fc4ff",potDecor:"hearts",cup:"#b98cff",cupDecor:"plain",treat:"cupcake",treatColor:"#ff9ecf"});
let stopScene=()=>{},onResize=null;
function go(fn){stopScene();stopScene=()=>{};onResize=null;try{window.speechSynthesis&&speechSynthesis.cancel();}catch(e){}fn();}
addEventListener("resize",()=>onResize&&onResize());addEventListener("orientationchange",()=>setTimeout(()=>onResize&&onResize(),250));
(function(){const s=document.getElementById("stars");for(let i=0;i<14;i++){const e=document.createElement("i");e.textContent=["✨","⭐","💖","🦄","🌈","🌸"][i%6];e.style.left=Math.random()*100+"vw";e.style.fontSize=(14+Math.random()*20)+"px";e.style.animationDuration=(16+Math.random()*18)+"s";e.style.animationDelay=(-Math.random()*30)+"s";s.appendChild(e);}})();
// particles shared by preview screens
function mkBurst(parts,x,y,col,n=22){for(let i=0;i<n;i++){const a=Math.random()*TAU,sp=rnd(60,260);parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-80,l:1,c:col==="rainbow"||col==="gold"?pick(["#ffd84d","#ff7ec0","#7fe0ff","#fff","#a97bff"]):pick([col,"#fff",lite(col,.4)]),g:1});}}
function stepParts(ctx,parts,dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.l-=dt*(p.g?1.1:.9);if(p.l<=0){parts.splice(i,1);continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.g)p.vy+=300*dt;star(ctx,p.x,p.y,(p.s||9)*p.l+2,p.l,p.c);}}
function halo(ctx,W,H,col="#ffe6fb"){const g=ctx.createRadialGradient(W/2,H*.55,10,W/2,H*.55,Math.max(W,H)*.6);g.addColorStop(0,"#fff");g.addColorStop(.5,col);g.addColorStop(1,"rgba(230,220,255,.0)");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}

/* ---------- title ---------- */
function title(){
  Snd.music("menu");const last=store.get("last",null);
  root.innerHTML=`<div class="scr"><h1 class="logo">🦄 TEA PARTY 🫖</h1><div class="stagebox"><canvas></canvas></div><div class="stack">
   <button class="btn" id="a" style="width:min(92%,420px)">▶ Play!</button>
   <button class="btn blue" id="b" style="width:min(92%,420px)">👭 Play with a friend</button></div></div>`;
  const cv=root.querySelector("canvas"),parts=[];
  stopScene=loop((dt,T)=>{const{ctx,W,H}=fit(cv);ctx.clearRect(0,0,W,H);halo(ctx,W,H);
    const ids=[2,0,7],h=Math.min(H*.86,W*.62);
    ids.forEach((id,i)=>{const x=W*(.2+.3*i)+(i===1?W*.0:0),hh=h*(i===1?1:.82),b=Math.sin(T*2+i)*6;drawUni(ctx,{id,horn:"gold"},x,H*.97-b,hh,i===2);});
    if(Math.random()<.2)parts.push({x:rnd(0,W),y:rnd(0,H*.6),vx:0,vy:-20,l:1,c:pick(["#ffd84d","#fff","#ff9ecf"]),s:8});stepParts(ctx,parts,dt);});
  document.getElementById("a").onclick=()=>{Snd.click();begin("ai");};
  document.getElementById("b").onclick=()=>{Snd.click();begin("friend");};
  setTimeout(()=>say("Welcome to Tea Party!"),300);
}
function begin(mode){S.mode=mode;S.cfgs=[];S.party=[mkParty(),mkParty()];S.found=[];S.level=0;go(()=>pickScreen(0));}

/* ---------- pick a unicorn (big swipe carousel) ---------- */
function pickScreen(pi){
  let idx=pi===0&&store.get("last",null)?store.get("last").id:0;let anim={t:1,dir:0};
  root.innerHTML=`<div class="scr split"><div class="stagebox"><canvas></canvas><button class="arr l">◀</button><button class="arr r">▶</button><div class="ttl" id="nm"></div></div>
   <div class="panel"><div class="lab">${S.mode==="friend"?`Player ${pi+1} — `:""}Swipe to pick your unicorn!</div><div class="thumbs" id="th"></div><button class="btn cta" id="ok">This one! 💖</button></div></div>`;
  const cv=root.querySelector("canvas"),nm=document.getElementById("nm"),th=document.getElementById("th");
  const set=(n,dir)=>{idx=(n+10)%10;anim={t:0,dir};Snd.pop();nm.textContent=U_NAMES[idx];th.querySelectorAll(".thumb").forEach((e,i)=>e.classList.toggle("sel",i===idx));};
  U_NAMES.forEach((n,i)=>{const b=document.createElement("button");b.className="thumb"+(i===idx?" sel":"");b.appendChild(uniThumb(i,64));b.onclick=()=>set(i,i>idx?1:-1);th.appendChild(b);});
  nm.textContent=U_NAMES[idx];const parts=[];
  root.querySelector(".arr.l").onclick=()=>set(idx-1,-1);root.querySelector(".arr.r").onclick=()=>set(idx+1,1);
  let sx=null;cv.parentElement.addEventListener("pointerdown",e=>{sx=e.clientX;});cv.parentElement.addEventListener("pointerup",e=>{if(sx!==null){const d=e.clientX-sx;if(Math.abs(d)>40)set(idx+(d<0?1:-1),d<0?1:-1);}sx=null;});
  stopScene=loop((dt,T)=>{const{ctx,W,H}=fit(cv);ctx.clearRect(0,0,W,H);halo(ctx,W,H);anim.t=Math.min(1,anim.t+dt*4);const e=1-Math.pow(1-anim.t,3),off=anim.dir*W*.5*(1-e);
    const h=Math.min(H*.9,W*1.25),b=Math.sin(T*2)*5;ctx.save();ctx.globalAlpha=.3+.7*e;drawUni(ctx,{id:idx,horn:"gold"},W/2+off,H*.95-b,h,false);ctx.restore();
    const tp=hornTip({id:idx},W/2+off,H*.95-b,h,false);star(ctx,tp.x,tp.y,10+4*Math.sin(T*5),.9,"#fff6a8");stepParts(ctx,parts,dt);});
  document.getElementById("ok").onclick=()=>{Snd.sparkle();S.cfgs[pi]=mkCfg(idx);const sv=store.get("last",null);if(pi===0&&sv&&sv.id===idx){Object.assign(S.cfgs[0],{horn:sv.horn,acc:sv.acc,name:sv.name});}go(()=>studio(pi));};
  setTimeout(()=>say("Pick your unicorn!"),250);
}

/* ---------- dress-up studio ---------- */
function studio(pi){
  const c=S.cfgs[pi];let tab=0;const parts=[];let pop=0;
  root.innerHTML=`<div class="scr split"><div class="stagebox"><canvas></canvas><div class="ttl">${c.name}</div></div>
   <div class="panel"><div class="tabs"><button class="tab on" data-t="0">✨ Horn</button><button class="tab" data-t="1">👑 Dress up</button><button class="tab" data-t="2">✏️ Name</button></div>
   <div class="opts" id="op"></div><button class="btn cta" id="nx">Next ▶</button></div></div>`;
  const cv=root.querySelector("canvas"),op=document.getElementById("op"),ttl=root.querySelector(".ttl");
  const burst=()=>{pop=1;const{W,H}=fit(cv),h=Math.min(H*.92,W*1.3),tp=hornTip(c,W/2,H*.95,h,false);mkBurst(parts,tp.x,tp.y,c.horn==="gold"?"#ffd84d":c.horn,26);};
  const render=()=>{
    if(tab===0){op.innerHTML=`<div class="lab">Tap a horn color!</div>`+HORNS.map(h=>`<button class="sw ${c.horn===h[1]?"sel":""}" data-h="${h[1]}" style="background:${h[1]==="rainbow"?"linear-gradient(135deg,#ff5a5a,#ffd84d,#5fdc5f,#4aa8ff,#a56bff)":h[1]==="gold"?"linear-gradient(135deg,#fff0a0,#e8a317)":h[1]}"></button>`).join("");
      op.querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>{c.horn=b.dataset.h;Snd.sparkle();burst();render();});}
    if(tab===1){op.innerHTML=`<div class="lab">Pick something pretty!</div>`+ACCS.map(a=>`<button class="opt ${c.acc===a[1]?"sel":""}" data-a="${a[1]}"><span class="em">${a[1]||"🚫"}</span>${a[0]}</button>`).join("");
      op.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{c.acc=b.dataset.a;Snd.pop();pop=1;const{W,H}=fit(cv),h=Math.min(H*.92,W*1.3);mkBurst(parts,W/2-h*.12,H*.95-h*.82,"#ffd84d",18);render();});}
    if(tab===2){op.innerHTML=`<div class="lab">Name your unicorn!</div><input type="text" id="nmi" maxlength="14" value="${c.name}">`;
      document.getElementById("nmi").oninput=e=>{c.name=e.target.value;ttl.textContent=c.name||" ";};}
  };
  root.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{tab=+t.dataset.t;root.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===t));Snd.click();render();});
  render();
  stopScene=loop((dt,T)=>{const{ctx,W,H}=fit(cv);ctx.clearRect(0,0,W,H);halo(ctx,W,H);pop=Math.max(0,pop-dt*3);
    const h=Math.min(H*.92,W*1.3),b=Math.sin(T*2)*4;drawUni(ctx,c,W/2,H*.95-b,h,false,{squash:pop*.04,accSize:.15});
    const tp=hornTip(c,W/2,H*.95-b,h,false);star(ctx,tp.x,tp.y,11+5*Math.sin(T*6),.95,c.horn==="gold"||c.horn==="rainbow"?"#fff6a8":lite(c.horn,.6));
    if(Math.random()<.25)parts.push({x:tp.x+rnd(-20,20),y:tp.y+rnd(-10,20),vx:rnd(-20,20),vy:rnd(-30,-10),l:.9,c:c.horn==="gold"||c.horn==="rainbow"?pick(["#ffd84d","#ff9ecf","#7fe0ff"]):c.horn,s:7});
    stepParts(ctx,parts,dt);});
  document.getElementById("nx").onclick=()=>{Snd.click();c.name=(c.name||"").trim()||U_NAMES[c.id];if(pi===0)store.set("last",{id:c.id,horn:c.horn,acc:c.acc,name:c.name});go(()=>planScreen(pi));};
  setTimeout(()=>say("Make it sparkle! Pick a horn color and something pretty to wear."),250);
}

/* ---------- party studio: see the real items change ---------- */
function planScreen(pi){
