<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Epic Transcript Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0a0d14;
    --panel: rgba(20, 25, 41, 0.85);
    --panel-2: rgba(28, 33, 49, 0.95);
    --line: rgba(212, 168, 67, 0.18);
    --line-strong: rgba(212, 168, 67, 0.45);
    --gold: #d4a843;
    --gold-bright: #f5c660;
    --text: #ecebe7;
    --muted: #8a8d97;
    --danger: #e85d4d;
    --good: #5fd49a;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(212,168,67,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(212,168,67,0.03) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    top: -200px; left: 50%; transform: translateX(-50%);
    width: 1100px; height: 600px;
    background: radial-gradient(ellipse at center, rgba(212,168,67,0.08) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .shell {
    position: relative;
    z-index: 1;
    max-width: 880px;
    margin: 0 auto;
    padding: 36px 24px 120px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .header { text-align: center; }
  .logo {
    display: inline-flex; align-items: center; gap: 12px;
    margin-bottom: 8px;
  }
  .logo-mark {
    width: 36px; height: 36px;
    border-radius: 9px;
    background: linear-gradient(135deg, #f5c660, #c9881e);
    color: #0a0d14;
    font-weight: 900;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 22px rgba(212,168,67,0.35);
    letter-spacing: -1px;
    font-size: 16px;
  }
  .title {
    font-size: 1.25rem;
    font-weight: 800;
    letter-spacing: 0.18em;
    color: var(--gold-bright);
    text-transform: uppercase;
  }
  .tagline {
    color: var(--muted);
    font-size: 0.95rem;
    letter-spacing: 0.02em;
  }

  .banner {
    background: rgba(232, 93, 77, 0.12);
    border: 1px solid rgba(232, 93, 77, 0.4);
    border-radius: 12px;
    padding: 12px 16px;
    color: #f3b3aa;
    font-size: 0.85rem;
    line-height: 1.5;
  }
  .banner.hidden { display: none; }
  .banner b { color: #ffd6cf; }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 22px;
    backdrop-filter: blur(8px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.35);
  }

  .url-row { display: flex; gap: 10px; }
  .url-input {
    flex: 1;
    height: 48px;
    border: 1px solid var(--line-strong);
    background: rgba(10, 13, 20, 0.7);
    border-radius: 10px;
    padding: 0 14px;
    color: var(--text);
    font-size: 0.95rem;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .url-input::placeholder { color: var(--muted); }
  .url-input:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(212,168,67,0.15);
  }

  .grab-btn {
    height: 48px;
    padding: 0 22px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--gold-bright), #c9881e);
    color: #0a0d14;
    font-weight: 800;
    font-size: 0.95rem;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.15s, opacity 0.15s;
    box-shadow: 0 6px 18px rgba(212,168,67,0.3);
    white-space: nowrap;
  }
  .grab-btn:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 10px 24px rgba(212,168,67,0.42);
  }
  .grab-btn:disabled { opacity: 0.55; cursor: not-allowed; }

  .divider {
    text-align: center;
    color: var(--muted);
    font-size: 0.7rem;
    letter-spacing: 0.3em;
    margin: 16px 0 12px;
    text-transform: uppercase;
  }

  .drop-zone {
    border: 1.5px dashed var(--line-strong);
    border-radius: 12px;
    padding: 22px 16px;
    text-align: center;
    cursor: pointer;
    color: var(--muted);
    font-size: 0.9rem;
    transition: all 0.15s;
    background: rgba(10, 13, 20, 0.4);
  }
  .drop-zone:hover, .drop-zone.dragover {
    border-color: var(--gold);
    color: var(--text);
    background: rgba(212,168,67,0.06);
  }
  .drop-zone .file-name {
    color: var(--gold-bright);
    font-weight: 600;
    margin-top: 6px;
  }
  .drop-zone .types {
    display: block;
    color: var(--muted);
    font-size: 0.72rem;
    margin-top: 6px;
    letter-spacing: 0.04em;
  }
  .drop-zone input[type=file] { display: none; }

  .status {
    display: none;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    color: var(--text);
    font-size: 0.92rem;
  }
  .status.show { display: flex; }
  .status .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--gold-bright);
    box-shadow: 0 0 12px var(--gold-bright);
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.3; transform: scale(0.85); }
    50% { opacity: 1; transform: scale(1.15); }
  }
  .status.error .dot {
    background: var(--danger);
    box-shadow: 0 0 12px var(--danger);
    animation: none;
  }
  .status.done .dot {
    background: var(--good);
    box-shadow: 0 0 12px var(--good);
    animation: none;
  }
  .status .err-msg { color: #f3b3aa; }

  .result { display: none; }
  .result.show { display: block; }
  .result-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    color: var(--muted);
    font-size: 0.78rem;
    letter-spacing: 0.04em;
  }
  .result-meta .source {
    color: var(--gold-bright);
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 70%;
  }
  .transcript-box {
    background: rgba(8, 10, 16, 0.7);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px;
    max-height: 320px;
    overflow-y: auto;
    color: #d8d8d4;
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.86rem;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .transcript-box::-webkit-scrollbar { width: 8px; }
  .transcript-box::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 4px; }

  .actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .btn {
    height: 38px;
    padding: 0 14px;
    border: 1px solid var(--line-strong);
    background: rgba(10, 13, 20, 0.55);
    color: var(--text);
    font-weight: 600;
    font-size: 0.82rem;
    letter-spacing: 0.04em;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
  }
  .btn:hover { border-color: var(--gold); color: var(--gold-bright); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .toast {
    position: fixed;
    top: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: rgba(95, 212, 154, 0.16);
    border: 1px solid rgba(95, 212, 154, 0.5);
    color: #b9f1d6;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 50;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .toast.error {
    background: rgba(232,93,77,0.16);
    border-color: rgba(232,93,77,0.5);
    color: #f3b3aa;
  }

  /* Recent drawer */
  .drawer {
    position: fixed;
    bottom: 18px;
    right: 18px;
    width: 320px;
    max-width: calc(100vw - 36px);
    background: var(--panel-2);
    border: 1px solid var(--line-strong);
    border-radius: 12px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.5);
    overflow: hidden;
    z-index: 30;
  }
  .drawer-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    cursor: pointer;
    user-select: none;
    background: rgba(212,168,67,0.06);
  }
  .drawer-head .title-row {
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--gold-bright);
  }
  .drawer-head .chev { color: var(--muted); transition: transform 0.2s; }
  .drawer.open .drawer-head .chev { transform: rotate(180deg); }
  .drawer-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.25s ease;
  }
  .drawer.open .drawer-body { max-height: 360px; overflow-y: auto; }
  .recent-empty {
    padding: 18px;
    color: var(--muted);
    font-size: 0.82rem;
    text-align: center;
  }
  .recent-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-top: 1px solid var(--line);
    cursor: pointer;
    transition: background 0.15s;
  }
  .recent-item:hover { background: rgba(212,168,67,0.05); }
  .recent-item .meta {
    flex: 1;
    overflow: hidden;
  }
  .recent-item .src {
    font-size: 0.83rem;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .recent-item .when {
    font-size: 0.7rem;
    color: var(--muted);
    margin-top: 2px;
  }
  .recent-item .del {
    background: transparent;
    border: 1px solid transparent;
    color: var(--muted);
    font-size: 0.85rem;
    width: 26px; height: 26px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .recent-item .del:hover {
    color: var(--danger);
    border-color: rgba(232,93,77,0.4);
  }

  @media (max-width: 640px) {
    .url-row { flex-direction: column; }
    .grab-btn { width: 100%; }
    .drawer { width: calc(100vw - 24px); right: 12px; bottom: 12px; }
  }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <div class="logo">
      <div class="logo-mark">E</div>
      <div class="title">Epic Transcript Tool</div>
    </div>
    <div class="tagline">Drop a link or file. Grab the transcript.</div>
  </div>

  <div id="banner" class="banner hidden"></div>

  <div class="card">
    <form id="form" autocomplete="off">
      <div class="url-row">
        <input id="url" class="url-input" type="url" placeholder="Paste a YouTube, Vimeo, podcast, or media URL"
               inputmode="url" autocomplete="off" spellcheck="false" />
        <button id="grab" class="grab-btn" type="submit">Grab It →</button>
      </div>
      <div class="divider">— or drop a file —</div>
      <label class="drop-zone" id="drop">
        <input id="file" type="file"
               accept=".mp3,.wav,.m4a,.aac,.flac,.ogg,.opus,.mp4,.mov,.mkv,.webm,.avi,.txt,.md,.srt,.vtt" />
        <div class="dz-text">Click or drag a file here</div>
        <div class="file-name" id="fileName"></div>
        <div class="types">Audio · Video · TXT · MD · SRT · VTT</div>
      </label>
    </form>
  </div>

  <div id="status" class="status">
    <div class="dot"></div>
    <div id="statusText">Working...</div>
  </div>

  <div id="result" class="card result">
    <div class="result-meta">
      <div class="source" id="resultSource"></div>
      <div id="resultMethod"></div>
    </div>
    <div class="transcript-box" id="transcript"></div>
    <div class="actions">
      <button class="btn" id="copyBtn" type="button">Copy</button>
      <button class="btn" id="downloadBtn" type="button">TXT</button>
      <button class="btn" id="downloadMdBtn" type="button">Markdown</button>
      <button class="btn" id="downloadSrtBtn" type="button">SRT</button>
      <button class="btn" id="emailBtn" type="button">Email to Me</button>
    </div>
  </div>
</div>

<div id="toast" class="toast">Copied to clipboard ✓</div>

<div class="drawer" id="drawer">
  <div class="drawer-head" id="drawerHead">
    <div class="title-row">Recent <span id="drawerCount" style="opacity:.6"></span></div>
    <div class="chev">▲</div>
  </div>
  <div class="drawer-body" id="drawerBody">
    <div class="recent-empty">No transcripts yet.</div>
  </div>
</div>

<script>window.EPIC_TRANSCRIPT_API='https://epic-transcript.robyncrane.com';</script>
<script>
(() => {
  // Detect base path. When served behind the suite-server proxy at
  // /epic-transcript/, all API calls must include that prefix.
  function detectBase() {
    if (typeof window.EPIC_TRANSCRIPT_API === 'string' && window.EPIC_TRANSCRIPT_API) {
      return window.EPIC_TRANSCRIPT_API.replace(/\/$/, '');
    }
    const p = window.location.pathname || '/';
    const m = p.match(/^(\/epic-transcript)(?:\/|$)/);
    return m ? m[1] : '';
  }
  const API = detectBase();

  const $ = (id) => document.getElementById(id);
  const els = {
    form: $('form'), url: $('url'), grab: $('grab'),
    file: $('file'), drop: $('drop'), fileName: $('fileName'),
    status: $('status'), statusText: $('statusText'),
    result: $('result'), source: $('resultSource'), method: $('resultMethod'),
    transcript: $('transcript'),
    copyBtn: $('copyBtn'), downloadBtn: $('downloadBtn'), downloadMdBtn: $('downloadMdBtn'), downloadSrtBtn: $('downloadSrtBtn'), emailBtn: $('emailBtn'),
    toast: $('toast'),
    drawer: $('drawer'), drawerHead: $('drawerHead'), drawerBody: $('drawerBody'), drawerCount: $('drawerCount'),
    banner: $('banner'),
  };
  let currentRecord = null;
  const OWNER_KEY = 'epicTranscriptOwnerToken';
  function ownerToken() {
    let token = localStorage.getItem(OWNER_KEY);
    if (!token) {
      const bytes = new Uint8Array(24);
      crypto.getRandomValues(bytes);
      token = Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
      localStorage.setItem(OWNER_KEY, token);
    }
    return token;
  }
  function ownerHeaders(extra = {}) {
    return { ...extra, 'X-Transcript-Owner': ownerToken() };
  }

  const apiUrl = (path) => API + path;

  async function jfetch(path, opts = {}) {
    const r = await fetch(apiUrl(path), opts);
    let data = null;
    try { data = await r.json(); } catch (_) { /* non-json */ }
    if (!r.ok) {
      const msg = (data && (data.detail || data.error)) || r.statusText || 'Request failed';
      throw new Error(typeof msg === 'string' ? msg : JSON.stringify(msg));
    }
    return data;
  }

  function setStatus(text, mode) {
    els.status.classList.remove('error', 'done');
    els.statusText.classList.remove('err-msg');
    els.status.classList.add('show');
    if (mode === 'error') {
      els.status.classList.add('error');
      els.statusText.classList.add('err-msg');
    } else if (mode === 'done') {
      els.status.classList.add('done');
    }
    els.statusText.textContent = text;
  }
  function clearStatus() { els.status.classList.remove('show', 'error', 'done'); }

  function showToast(msg, isError = false) {
    els.toast.textContent = msg;
    els.toast.classList.toggle('error', !!isError);
    els.toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => els.toast.classList.remove('show'), 3000);
  }

  function renderResult(rec) {
    currentRecord = rec;
    els.source.textContent = rec.source || '(unknown source)';
    const len = rec.transcript ? rec.transcript.length : 0;
    const methodLabel = rec.method === 'captions' ? 'native captions'
      : rec.method === 'whisper' ? 'whisper'
      : rec.method === 'passthrough' ? 'pass-through'
      : rec.method;
    const dur = rec.duration_seconds ? ` · ${formatDuration(rec.duration_seconds)}` : '';
    const proc = rec.processing_seconds ? ` · ${rec.processing_seconds.toFixed(1)}s` : '';
    els.method.textContent = `${methodLabel} · ${len.toLocaleString()} chars${dur}${proc}`;
    els.transcript.textContent = rec.transcript || '';
    els.result.classList.add('show');
    autoCopy(rec.transcript || '');
  }

  function formatDuration(secs) {
    secs = Math.round(secs || 0);
    const h = Math.floor(secs / 3600);
    const m = Math.floor((secs % 3600) / 60);
    const s = secs % 60;
    return h > 0 ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`;
  }

  async function autoCopy(text) {
    if (!text) return;
    try {
      await navigator.clipboard.writeText(text);
      showToast('Copied to clipboard ✓');
    } catch (e) { /* ignore */ }
  }

  function lockUI(locked) {
    els.grab.disabled = locked;
    els.url.disabled = locked;
    els.file.disabled = locked;
    els.drop.style.pointerEvents = locked ? 'none' : '';
    els.drop.style.opacity = locked ? '0.55' : '';
  }

  // URL submit
  els.form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const url = els.url.value.trim();
    if (!url) { els.url.focus(); return; }
    lockUI(true);
    els.result.classList.remove('show');
    setStatus('Grabbing captions...');
    try {
      const stages = ['Grabbing captions...', 'Extracting audio...', 'Transcribing...'];
      let i = 0;
      const stageTimer = setInterval(() => {
        i = Math.min(i + 1, stages.length - 1);
        setStatus(stages[i]);
      }, 6000);
      const fd = new FormData();
      fd.append('url', url);
      fd.append('owner', ownerToken());
      const data = await jfetch('/api/transcribe-url', { method: 'POST', body: fd });
      clearInterval(stageTimer);
      setStatus('Done', 'done');
      renderResult(data.record);
      loadRecent();
      setTimeout(clearStatus, 1200);
    } catch (e) {
      setStatus('Error: ' + e.message, 'error');
    } finally {
      lockUI(false);
    }
  });

  // File picker / drop
  els.drop.addEventListener('click', (e) => {
    if (e.target === els.file) return;
    els.file.click();
  });
  ['dragenter','dragover'].forEach(ev => els.drop.addEventListener(ev, (e) => {
    e.preventDefault();
    els.drop.classList.add('dragover');
  }));
  ['dragleave','drop'].forEach(ev => els.drop.addEventListener(ev, (e) => {
    e.preventDefault();
    els.drop.classList.remove('dragover');
  }));
  els.drop.addEventListener('drop', (e) => {
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) {
      handleFile(e.dataTransfer.files[0]);
    }
  });
  els.file.addEventListener('change', () => {
    if (els.file.files && els.file.files[0]) handleFile(els.file.files[0]);
  });

  async function handleFile(file) {
    els.fileName.textContent = file.name;
    lockUI(true);
    els.result.classList.remove('show');
    const ext = (file.name.split('.').pop() || '').toLowerCase();
    const isText = ['txt','md','srt','vtt'].includes(ext);
    setStatus(isText ? 'Reading file...' : 'Transcribing...');
    try {
      const fd = new FormData();
      fd.append('file', file);
      fd.append('owner', ownerToken());
      const data = await jfetch('/api/transcribe-upload', { method: 'POST', body: fd });
      setStatus('Done', 'done');
      renderResult(data.record);
      loadRecent();
      setTimeout(clearStatus, 1200);
    } catch (e) {
      setStatus('Error: ' + e.message, 'error');
    } finally {
      lockUI(false);
      els.file.value = '';
    }
  }

  // Result actions
  els.copyBtn.addEventListener('click', async () => {
    if (!currentRecord) return;
    try {
      await navigator.clipboard.writeText(currentRecord.transcript || '');
      showToast('Copied to clipboard ✓');
    } catch (e) { showToast('Copy failed', true); }
  });
  function downloadCurrent(format) {
    if (!currentRecord) return;
    jfetch('/api/transcripts/' + currentRecord.id + '/download-link?format=' + encodeURIComponent(format), { method: 'POST', headers: ownerHeaders() })
      .then(data => { window.location.href = data.url; })
      .catch(e => showToast('Download failed: ' + e.message, true));
  }
  els.downloadBtn.addEventListener('click', () => downloadCurrent('txt'));
  els.downloadMdBtn.addEventListener('click', () => downloadCurrent('md'));
  els.downloadSrtBtn.addEventListener('click', () => downloadCurrent('srt'));
  els.emailBtn.addEventListener('click', async () => {
    if (!currentRecord) return;
    els.emailBtn.disabled = true;
    try {
      const data = await jfetch('/api/email/' + currentRecord.id, { method: 'POST', headers: ownerHeaders() });
      showToast('Emailed to ' + (data.to || 'you'));
    } catch (e) {
      showToast('Email failed: ' + e.message, true);
    } finally {
      els.emailBtn.disabled = false;
    }
  });

  // Recent drawer
  els.drawerHead.addEventListener('click', () => {
    els.drawer.classList.toggle('open');
  });

  function timeAgo(iso) {
    const t = Date.parse(iso);
    if (!t) return '';
    const s = Math.max(1, Math.floor((Date.now() - t) / 1000));
    if (s < 60) return s + 's ago';
    if (s < 3600) return Math.floor(s/60) + 'm ago';
    if (s < 86400) return Math.floor(s/3600) + 'h ago';
    return Math.floor(s/86400) + 'd ago';
  }

  async function loadRecent() {
    try {
      const data = await jfetch('/api/recent?limit=20', { headers: ownerHeaders() });
      const items = data.items || [];
      els.drawerCount.textContent = items.length ? '· ' + items.length : '';
      if (!items.length) {
        els.drawerBody.innerHTML = '<div class="recent-empty">No transcripts yet.</div>';
        return;
      }
      els.drawerBody.innerHTML = '';
      items.forEach(item => {
        const row = document.createElement('div');
        row.className = 'recent-item';
        row.innerHTML = `
          <div class="meta">
            <div class="src"></div>
            <div class="when"></div>
          </div>
          <button class="del" title="Delete">×</button>
        `;
        row.querySelector('.src').textContent = item.source || '(untitled)';
        row.querySelector('.when').textContent = timeAgo(item.created_at) + ' · ' + item.method;
        row.addEventListener('click', async (e) => {
          if (e.target.classList.contains('del')) return;
          try {
            const full = await jfetch('/api/transcripts/' + item.id, { headers: ownerHeaders() });
            renderResult(full);
            window.scrollTo({ top: 0, behavior: 'smooth' });
          } catch (err) { showToast('Could not open: ' + err.message, true); }
        });
        row.querySelector('.del').addEventListener('click', async (e) => {
          e.stopPropagation();
          if (!confirm('Delete this transcript?')) return;
          try {
            await jfetch('/api/transcripts/' + item.id, { method: 'DELETE', headers: ownerHeaders() });
            if (currentRecord && currentRecord.id === item.id) {
              els.result.classList.remove('show');
              currentRecord = null;
            }
            loadRecent();
          } catch (err) { showToast('Delete failed: ' + err.message, true); }
        });
        els.drawerBody.appendChild(row);
      });
    } catch (e) { /* keep silent */ }
  }

  async function loadSetup() {
    try {
      const s = await jfetch('/api/setup');
      if (s.missing && s.missing.length) {
        els.banner.innerHTML = '<b>Setup needed.</b> Missing: ' + s.missing.map(m => `<code>${m}</code>`).join(', ') + '. Add to <code>.env</code> and restart.';
        els.banner.classList.remove('hidden');
      } else {
        els.banner.classList.add('hidden');
      }
    } catch (e) { /* ignore */ }
  }

  loadSetup();
  loadRecent();
})();
</script>
</body>
</html>
